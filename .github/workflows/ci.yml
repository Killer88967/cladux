name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site's build cache (Turbopack's and the highlighted code), so each run
      # only rebuilds what changed. Starts over when the lockfile changes.
      - uses: actions/cache@v6
        with:
          path: apps/www/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - run: pnpm size
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # The CLI must start and print its help from the built bundle.
      - run: node packages/cli/dist/index.js --help

      # The registry the site serves must pass the CLI's own checks.
      - run: node packages/cli/dist/index.js registry validate apps/www/public/r

  e2e:
    name: Browser tests and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/www/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium webkit firefox

      # The plain HTML runtime, the site (search, themes, copy buttons) and axe on every page.
      - run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 14

  styles:
    name: Tailwind and CSS styles match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/www/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      # Every demo from the registry in both styles, compared screenshot by screenshot.
      - run: pnpm visual

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: styles-report
          path: apps/visual/report/styles
          retention-days: 14

  cli:
    name: CLI in fresh Next.js and Vite apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/www/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm e2e:cli

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cli-report
          path: apps/e2e/playwright-report
          retention-days: 14
