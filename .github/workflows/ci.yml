name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site's build cache (Turbopack's and the highlighted code), so each run
      # only rebuilds what changed. Starts over when the lockfile changes.
      - uses: actions/cache@v6
        with:
          path: apps/www/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - run: pnpm size
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # The CLI must start and print its help from the built bundle.
      - run: node packages/cli/dist/index.js --help

      # The registry the site serves must pass the CLI's own checks.
      - run: node packages/cli/dist/index.js registry validate apps/www/public/r
