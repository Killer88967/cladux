<div class="cl-stack" style="--cl-gap: 1.5rem; width: 100%">
  <div class="cl-cluster">
    <span class="cl-badge">Stack</span>
    <span class="cl-badge" data-variant="secondary">Cluster</span>
    <span class="cl-badge" data-variant="outline">Grid</span>
    <button class="cl-button" data-size="sm" style="margin-inline-start: auto">Action</button>
  </div>
  <div class="cl-grid-auto" style="--cl-min: 10rem">
    <div class="cl-card">
      <div class="cl-card-header">
        <div class="cl-card-title">Starter</div>
        <div class="cl-card-description">For side projects</div>
      </div>
    </div>
    <div class="cl-card">
      <div class="cl-card-header">
        <div class="cl-card-title">Pro</div>
        <div class="cl-card-description">For growing teams</div>
      </div>
    </div>
    <div class="cl-card">
      <div class="cl-card-header">
        <div class="cl-card-title">Enterprise</div>
        <div class="cl-card-description">For everyone else</div>
      </div>
    </div>
  </div>
</div>
