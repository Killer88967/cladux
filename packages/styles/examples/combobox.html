<div class="cl-combobox">
  <input
    class="cl-combobox-input"
    role="combobox"
    aria-controls="combobox-demo-list"
    aria-label="Framework"
    placeholder="Select a framework"
  />
  <button
    class="cl-combobox-trigger"
    type="button"
    tabindex="-1"
    aria-label="Show options"
  ></button>
  <div class="cl-combobox-content" popover="manual">
    <div class="cl-combobox-empty">No items found.</div>
    <div class="cl-combobox-list" role="listbox" id="combobox-demo-list" aria-label="Frameworks">
      <div class="cl-combobox-item" role="option">Next.js</div>
      <div class="cl-combobox-item" role="option">SvelteKit</div>
      <div class="cl-combobox-item" role="option">Nuxt.js</div>
      <div class="cl-combobox-item" role="option">Remix</div>
      <div class="cl-combobox-item" role="option">Astro</div>
    </div>
  </div>
</div>
